[project]
name = "gbaport"
version = "0.1.0"
description = "Personal-use pipeline that turns GBA ROMs into native C ports"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
gbaport = "gbaport.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "keystone-engine==0.9.2",
    "unicorn==2.1.4",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gbaport"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
# Unicorn raises and handles access violations internally on Windows, and
# faulthandler would print each one as a fatal error.
addopts = "-q -p no:faulthandler"
markers = ["recompiled_only: a lifter test only recompiled code can pass (it has missing code)"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint.per-file-ignores]
# dict(field=value) tables read better than literals in decoder test cases
"tests/*" = ["C408"]
